[server]
# Browser uploads are capped at 400 MB (Streamlit holds uploads in memory; Cloud containers have ~1 GB RAM); larger/full-length recordings should use the Link tab
# (server-side streaming download with resume) - see DESIGN.md "large uploads".
maxUploadSize = 400
maxMessageSize = 200
headless = true

[theme]
primaryColor = "#4F46E5"
base = "light"

[browser]
gatherUsageStats = false
