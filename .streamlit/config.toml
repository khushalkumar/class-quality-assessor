[server]
# Browser uploads are capped at 500 MB; larger/full-length recordings should use the Link tab
# (server-side streaming download with resume) - see DESIGN.md "large uploads".
maxUploadSize = 500
maxMessageSize = 200
headless = true

[theme]
primaryColor = "#4F46E5"
base = "light"

[browser]
gatherUsageStats = false
