[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", ".cache", "eval/runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "B023", "UP045", "UP037"]

[tool.ruff.lint.isort]
known-first-party = ["classqa", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
